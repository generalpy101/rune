[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned exactly: child webviews (browser panes) need the `unstable` API,
# which may change in any minor release.
tauri = { version = "=2.11.2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tempfile = "3"
# Chrome profile import for browser panes: read the cookie database and
# decrypt values (AES-128-CBC, key via PBKDF2-HMAC-SHA1).
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

# Keychain access for Chrome's "Chrome Safe Storage" key (already in the tree via TLS).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Signal/process-group APIs are POSIX-only; Windows uses taskkill instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

